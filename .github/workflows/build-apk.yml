name: Build YingYa v1.0.0-rc3 Packages

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified v0.5 base
        shell: bash
        run: |
          cat source-v0.5.0.part00.b64 source-v0.5.0.part01.b64 source-v0.5.0.part02.b64 source-v0.5.0.part03a.b64 source-v0.5.0.part03b.b64 source-v0.5.0.part03c.b64 source-v0.5.0.part03d.b64 > source-v0.5.0.b64
          base64 -d source-v0.5.0.b64 > source-v0.5.0.zip
          echo "d306e0e9c7e26fc80b97100e4600e1d934b9e15e190b28545713364191413bc7  source-v0.5.0.zip" | sha256sum -c -
          mkdir -p src/YingYa
          unzip -q source-v0.5.0.zip -d src/YingYa
          cp fixes-v0.5.0/MediaDeletion.kt src/YingYa/app/src/main/java/com/example/videoshrink/MediaDeletion.kt

      - name: Apply verified v0.6 overlay
        shell: bash
        run: |
          cat overlay-v0.6.0.part00.b64 overlay-v0.6.0.part01.b64 overlay-v0.6.0.part02.b64 overlay-v0.6.0.part03.b64 overlay-v0.6.0.part04.b64 overlay-v0.6.0.part05.b64 > overlay-v0.6.0.b64
          base64 -d overlay-v0.6.0.b64 > overlay-v0.6.0.tar.gz
          echo "cb31be249d63b89ffb8e7b3d2fd96c1037a5e1e984e07bdc01d49e545c665bbf  overlay-v0.6.0.tar.gz" | sha256sum -c -
          tar -xzf overlay-v0.6.0.tar.gz -C src/YingYa

      - name: Apply verified v0.7 overlay
        shell: bash
        run: |
          cat source-v0.7.0.part00.b64 source-v0.7.0.part01.b64 source-v0.7.0.part02.b64 source-v0.7.0.part03.b64 > source-v0.7.0-overlay.b64
          base64 -d source-v0.7.0-overlay.b64 > source-v0.7.0-overlay.tar.gz
          echo "1c2256463ba0794808667844597defaa7d1e1decc0d92c471e21c667ca1b9aca  source-v0.7.0-overlay.tar.gz" | sha256sum -c -
          tar -xzf source-v0.7.0-overlay.tar.gz -C src/YingYa
          cp fixes-v0.7.0/SettingsActivity.kt src/YingYa/app/src/main/java/com/example/videoshrink/SettingsActivity.kt
          cp fixes-v0.7.0/build.gradle.kts src/YingYa/app/build.gradle.kts

      - name: Apply verified v0.8 overlay
        shell: bash
        run: |
          cat overlay-v0.8s.00.b64 overlay-v0.8s.01-02.b64 overlay-v0.8s.03-04.b64 overlay-v0.8s.05-06.b64 overlay-v0.8s.07.b64 > overlay-v0.8.0.b64
          base64 -d overlay-v0.8.0.b64 > overlay-v0.8.0.tar.gz
          echo "16aec77ca2daa0f9a0b837ef0cb03e9ec1c7ec7f820ed706799950384baea3ba  overlay-v0.8.0.tar.gz" | sha256sum -c -
          tar -xzf overlay-v0.8.0.tar.gz -C src/YingYa

      - name: Apply verified v1.0.0-rc1 overlay
        shell: bash
        run: |
          cat overlay-v1.0.0-rc1.part00-01.b64 overlay-v1.0.0-rc1.part02-03.b64 overlay-v1.0.0-rc1.part04-05.b64 overlay-v1.0.0-rc1.part06-07.b64 overlay-v1.0.0-rc1.part08-09.b64 overlay-v1.0.0-rc1.part10.b64 > overlay-v1.0.0-rc1.b64
          base64 -d overlay-v1.0.0-rc1.b64 > overlay-v1.0.0-rc1.tar.gz
          echo "967549b8e1c13528f5f58c71697cc95feaac22b0a33fd051d57f6a0009ac0515  overlay-v1.0.0-rc1.tar.gz" | sha256sum -c -
          tar -xzf overlay-v1.0.0-rc1.tar.gz -C src/YingYa
          base64 -d fixes-v1.0.0-rc1/CompressionService.b64 > fixes-v1.0.0-rc1/CompressionService.tar.gz
          echo "10e214055ba485b8669f24fedd29f5c770d51656202f7ddee2d19f3fb1c58489  fixes-v1.0.0-rc1/CompressionService.tar.gz" | sha256sum -c -
          tar -xzf fixes-v1.0.0-rc1/CompressionService.tar.gz -C src/YingYa

      - name: Apply verified v1.0.0-rc2 overlay
        shell: bash
        run: |
          cat overlay-v1.0.0-rc2.part00 overlay-v1.0.0-rc2.part01 overlay-v1.0.0-rc2.part02 overlay-v1.0.0-rc2.part03 > overlay-v1.0.0-rc2.tar.gz
          echo "7f41a488df9c0f36ae19ca607c999457b6dd3856e79b4c2e56f9721eee6f0e9d  overlay-v1.0.0-rc2.tar.gz" | sha256sum -c -
          tar -xzf overlay-v1.0.0-rc2.tar.gz -C src/YingYa

      - name: Apply verified v1.0.0-rc3 overlay
        shell: bash
        run: |
          base64 -d overlay-v1.0.0-rc3.group00.b64 > overlay-v1.0.0-rc3.part00.bin
          cat \
            overlay-v1.0.0-rc3.part00.bin \
            overlay-v1.0.0-rc3.part01.bin \
            overlay-v1.0.0-rc3.part02.bin \
            overlay-v1.0.0-rc3.part03_04.bin \
            overlay-v1.0.0-rc3.part05a.bin \
            overlay-v1.0.0-rc3.part05b.bin \
            overlay-v1.0.0-rc3.part06a.bin \
            overlay-v1.0.0-rc3.part06b.bin \
            overlay-v1.0.0-rc3.part07.bin \
            > overlay-v1.0.0-rc3.tar.gz
          echo "dc93840e1a429dc1b863c64aeace00b192a6212656a121a9e5ebcb44f3c5ed08  overlay-v1.0.0-rc3.tar.gz" | sha256sum -c -
          tar -xzf overlay-v1.0.0-rc3.tar.gz -C src/YingYa

      - name: Apply processed-video awareness
        shell: bash
        run: |
          cat processed-overlay-v1.0.0-rc3.part0.b64 processed-overlay-v1.0.0-rc3.part1.b64 processed-overlay-v1.0.0-rc3.part2.b64 > processed-overlay-v1.0.0-rc3.b64
          base64 -d processed-overlay-v1.0.0-rc3.b64 > processed-overlay-v1.0.0-rc3.tar.gz
          echo "837af8e838f43a3f2fdf34cd4c4aa63562369d212c69186514f9855dc74b7d29  processed-overlay-v1.0.0-rc3.tar.gz" | sha256sum -c -
          tar -xzf processed-overlay-v1.0.0-rc3.tar.gz -C src/YingYa

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: YingYa-v1.0.0-rc3-source-snapshot
          path: src/YingYa
          if-no-files-found: error

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK and AAB
        working-directory: src/YingYa
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Stage build outputs
        shell: bash
        run: |
          mkdir -p dist
          cp src/YingYa/app/build/outputs/apk/debug/app-debug.apk dist/YingYa-v1.0.0-rc3-debug.apk
          cp src/YingYa/app/build/outputs/apk/release/app-release-unsigned.apk dist/YingYa-v1.0.0-rc3-release-unsigned.apk
          cp src/YingYa/app/build/outputs/bundle/release/app-release.aab dist/YingYa-v1.0.0-rc3-release-unsigned.aab
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" dist/apksigner.jar
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: YingYa-v1.0.0-rc3-build-outputs
          path: dist
          if-no-files-found: error
