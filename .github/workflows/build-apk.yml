name: Build VideoShrink APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          cat source.part*.b64 > source.zip.b64
          base64 -d source.zip.b64 > source.zip
          echo "79ca5fcc901eb7e4308fefa926c1229d6819be128f2567a40c8b494b3f269092  source.zip" | sha256sum -c -
          mkdir -p src
          unzip -q source.zip -d src
          cp patches/app-build.gradle.kts src/VideoShrink/app/build.gradle.kts
          cp patches/MediaStoreMuxerFactory.kt src/VideoShrink/app/src/main/java/com/example/videoshrink/MediaStoreMuxerFactory.kt

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: VideoShrink-v0.2-source-snapshot
          path: src/VideoShrink
          if-no-files-found: error

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: src/VideoShrink
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoShrink-v0.2-debug-apk
          path: src/VideoShrink/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
