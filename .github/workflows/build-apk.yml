name: Build YingYa APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified v0.5 base
        shell: bash
        run: |
          cat source-v0.5.0.part00.b64 source-v0.5.0.part01.b64 source-v0.5.0.part02.b64 source-v0.5.0.part03a.b64 source-v0.5.0.part03b.b64 source-v0.5.0.part03c.b64 source-v0.5.0.part03d.b64 > source-v0.5.0.b64
          base64 -d source-v0.5.0.b64 > source-v0.5.0.zip
          echo "d306e0e9c7e26fc80b97100e4600e1d934b9e15e190b28545713364191413bc7  source-v0.5.0.zip" | sha256sum -c -
          mkdir -p src/YingYa
          unzip -q source-v0.5.0.zip -d src/YingYa
          cp fixes-v0.5.0/MediaDeletion.kt src/YingYa/app/src/main/java/com/example/videoshrink/MediaDeletion.kt

      - name: Apply verified v0.6 overlay
        shell: bash
        run: |
          sha256sum overlay-v0.6.0.part00.b64 overlay-v0.6.0.part01.b64 overlay-v0.6.0.part02.b64 overlay-v0.6.0.part03.b64 overlay-v0.6.0.part04.b64 overlay-v0.6.0.part05.b64
          cat overlay-v0.6.0.part00.b64 overlay-v0.6.0.part01.b64 overlay-v0.6.0.part02.b64 overlay-v0.6.0.part03.b64 overlay-v0.6.0.part04.b64 overlay-v0.6.0.part05.b64 > overlay-v0.6.0.b64
          base64 -d overlay-v0.6.0.b64 > overlay-v0.6.0.tar.gz
          echo "cb31be249d63b89ffb8e7b3d2fd96c1037a5e1e984e07bdc01d49e545c665bbf  overlay-v0.6.0.tar.gz" | sha256sum -c -
          tar -xzf overlay-v0.6.0.tar.gz -C src/YingYa

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: YingYa-v0.6.0-source-snapshot
          path: src/YingYa
          if-no-files-found: error

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: src/YingYa
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YingYa-v0.6.0-debug-apk
          path: src/YingYa/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
